// narchy live loader — the first line of an AutoConfig file must be a comment.
//
// Firefox parses userChrome.css once per run and caches it for every window
// after, which is why a linked Firefox only shows a switch at its next start.
// This is the way round that: an AutoConfig script runs privileged JavaScript
// at startup, and nsIStyleSheetService registers a stylesheet into documents
// that are already open. So the sheets narchy renders are watched, and every
// switch is applied to the running browser.
//
// Installed by `narchy-firefox-live install`, which is where the whole story
// of what this costs is written down. It reads nothing but narchy's own output
// and touches nothing but the two sheets it registers and the one pref that
// decides what websites are told to render as.

(() => {
  const { classes: Cc, interfaces: Ci } = Components;
  const timer = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");

  // A stat costs nothing; the wakeup it rides on is the whole expense, and on
  // a laptop that is the only part worth counting. So the loop runs fast only
  // when a switch has just happened — stepping through `narchy interactive`
  // keeps it there — settles down otherwise, and stops altogether while you
  // are away from the machine.
  const FAST_MS = 400;
  const SLOW_MS = 2500;
  const BURST_MS = 20000;
  const IDLE_S = 60;

  function env(name) {
    try {
      const value = Services.env.get(name);
      return value ? value : null;
    } catch (e) {
      return null;
    }
  }

  // Resolved here rather than written in at install time, so one installed
  // file serves whoever is logged in.
  const home = Services.dirsvc.get("Home", Ci.nsIFile).path;
  const state = (env("XDG_STATE_HOME") || home + "/.local/state") + "/narchy/current";

  const sss = Cc["@mozilla.org/content/style-sheet-service;1"]
    .getService(Ci.nsIStyleSheetService);
  const TYPE = sss.USER_SHEET;

  // The chrome sheet is written for userChrome.css, which Firefox applies to
  // chrome documents and nothing else. A sheet registered here goes to every
  // document there is, websites included, so it has to say where it belongs.
  // The content sheet already scopes itself to about:.
  const SHEETS = [
    { file: state + "/firefox.css", scope: "chrome:", uri: null },
    { file: state + "/firefox-content.css", scope: null, uri: null },
  ];

  // Which side of light and dark to hand a website. A running Firefox takes a
  // pref change at once, so unlike a linked profile this needs no restart.
  const MODE_FILE = state + "/firefox.conf";
  const SCHEME_PREF = "layout.css.prefers-color-scheme.content-override";

  // One file is watched for all three. narchy renders them together and swaps
  // the whole directory into place, so they arrive at the same instant and
  // watching more is two thirds of the stat calls for no more news. The cost
  // is that editing one of the others by hand goes unnoticed until this one
  // moves — `touch` it, or run `narchy set` again.
  const SENTINEL = SHEETS[0].file;

  function nsfile(path) {
    const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    file.initWithPath(path);
    return file;
  }

  // -1 for a file that is not there: narchy swaps its state directory into
  // place rather than writing over it, so mid-switch there is a moment with
  // nothing to read, and the next tick finds it.
  function stamp(path) {
    try {
      const file = nsfile(path);
      return file.exists() ? file.lastModifiedTime : -1;
    } catch (e) {
      return -1;
    }
  }

  function read(path) {
    const file = nsfile(path);
    if (!file.exists()) return null;
    const stream = Cc["@mozilla.org/network/file-input-stream;1"]
      .createInstance(Ci.nsIFileInputStream);
    stream.init(file, 0x01, 0o444, 0);
    const conv = Cc["@mozilla.org/intl/converter-input-stream;1"]
      .createInstance(Ci.nsIConverterInputStream);
    conv.init(stream, "UTF-8", 8192, 0);
    let text = "";
    const chunk = {};
    while (conv.readString(8192, chunk) != 0) text += chunk.value;
    conv.close();
    return text;
  }

  function log(message) {
    try {
      Services.console.logStringMessage("narchy: " + message);
    } catch (e) {}
  }

  // A data: URI rather than the file itself: the sheet is keyed by its URI, so
  // registering the same path twice would hand back the copy already parsed.
  function register(sheet) {
    let css;
    try {
      css = read(sheet.file);
    } catch (e) {
      log("cannot read " + sheet.file + ": " + e);
      return;
    }
    if (css === null) return;

    if (sheet.scope) {
      css = "@-moz-document url-prefix(" + sheet.scope + ") {\n" + css + "\n}\n";
    }
    const uri = Services.io.newURI(
      "data:text/css;charset=utf-8," + encodeURIComponent(css));

    try {
      if (sheet.uri && sss.sheetRegistered(sheet.uri, TYPE)) {
        sss.unregisterSheet(sheet.uri, TYPE);
      }
      sss.loadAndRegisterSheet(uri, TYPE);
      sheet.uri = uri;
    } catch (e) {
      log("cannot register " + sheet.file + ": " + e);
    }
  }

  function applyMode() {
    let text;
    try {
      text = read(MODE_FILE);
    } catch (e) {
      return;
    }
    if (text === null) return;
    const match = /^mode=(\w+)/m.exec(text);
    if (!match) return;
    try {
      Services.prefs.setIntPref(SCHEME_PREF, match[1] === "dark" ? 0 : 1);
    } catch (e) {
      log("cannot set " + SCHEME_PREF + ": " + e);
    }
  }

  let seen = -1;
  let changed = 0;
  let period = 0;
  let handle = null;

  function arm(ms) {
    if (handle !== null) {
      if (period === ms) return;
      timer.clearInterval(handle);
    }
    handle = timer.setInterval(tick, ms);
    period = ms;
  }

  function disarm() {
    if (handle === null) return;
    timer.clearInterval(handle);
    handle = null;
    period = 0;
  }

  function tick() {
    // Below zero is the moment mid-switch when the directory has been taken
    // away and not yet put back. Nothing to do but come round again.
    const now = stamp(SENTINEL);
    if (now >= 0 && now !== seen) {
      seen = now;
      for (const sheet of SHEETS) register(sheet);
      applyMode();
      changed = Date.now();
    }
    arm(Date.now() - changed < BURST_MS ? FAST_MS : SLOW_MS);
  }

  // Nobody is looking at a browser they have walked away from, and a switch
  // made in the meantime is caught the moment they come back. If the platform
  // has no idle notifications to give, this does nothing and the loop simply
  // keeps its slow beat.
  function watchIdle() {
    let idle;
    try {
      idle = Cc["@mozilla.org/widget/useridleservice;1"]
        .getService(Ci.nsIUserIdleService);
    } catch (e) {
      log("no idle service: " + e);
      return;
    }
    try {
      idle.addIdleObserver({
        observe(subject, topic) {
          if (topic === "idle") disarm();
          else tick();
        },
      }, IDLE_S);
    } catch (e) {
      log("cannot observe idle: " + e);
    }
  }

  // The first window is late enough that everything above is ready, and the
  // guard is for the second and third windows, which fire it again.
  let started = false;
  Services.obs.addObserver({
    observe() {
      if (started) return;
      started = true;
      tick();
      watchIdle();
      log("watching " + state);
    },
  }, "browser-delayed-startup-finished");
})();
